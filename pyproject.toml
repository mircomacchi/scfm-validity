[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scfm-validity"
version = "0.1.0"
description = "Do single-cell foundation model embeddings capture biology or artefacts? A validity harness for scRNA-seq embeddings."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mirco Macchi" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "matplotlib",
    "scib-metrics>=0.5",
    "typer>=0.12",
]

[project.optional-dependencies]
scvi = ["scvi-tools>=1.2"]
fm = ["helical"]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
scfm-validity = "scfm_validity.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scfm_validity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer declares CLI arguments as defaults
